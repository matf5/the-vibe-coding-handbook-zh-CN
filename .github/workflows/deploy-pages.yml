# Deploy the Chinese-edition site to GitHub Pages.
#
# The site is a static directory (site/) whose data.js / feed.xml are
# generated at build time by `node site/build.js` from README.zh-CN.md,
# zh-CN/ROADMAP.md and zh-CN/glossary/terms.md. The generated files are
# NOT committed to the repo: they are produced inside the runner and
# uploaded as part of the site/ artifact below.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site data
        run: node site/build.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
